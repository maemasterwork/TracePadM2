    exercises:
    - id: e1
      prompt:
        en: 'Use a <code>while</code> loop and arithmetic only (no strings) to add up the digits of <code>n</code>. Print only the sum.'
      starter: |
        n = 90517
        digit_sum = 0

        # your while loop here

        print(digit_sum)
      solution: |
        n = 90517
        digit_sum = 0

        while n > 0:
            digit_sum += n % 10
            n //= 10

        print(digit_sum)
      param:
        pattern: ^n = .*$
        flags: m
      tests:
      - out: '22'
      - set: n = 9
        out: '9'
      - set: n = 1000
        out: '1'
      - set: n = 9999
        out: '36'
      hints:
      - en: '<code>n % 10</code> is the last digit. Add it to <code>digit_sum</code>.'
      - en: Remove the last digit with <code>n //= 10</code>. Keep going while <code>n &gt; 0</code>.
    - id: e2
      prompt:
        en: 'The Collatz sequence: while <code>n</code> is not 1, halve it if it is even, otherwise make it <code>3 * n + 1</code>. Count the steps and print <code>Steps: ...</code>.'
      starter: |
        n = 27
        steps = 0

        # your while loop here

        print("Steps:", steps)
      solution: |
        n = 27
        steps = 0

        while n != 1:
            if n % 2 == 0:
                n //= 2
            else:
                n = 3 * n + 1
            steps += 1

        print("Steps:", steps)
      param:
        pattern: ^n = .*$
        flags: m
      tests:
      - out: 'Steps: 111'
      - set: n = 1
        out: 'Steps: 0'
      - set: n = 6
        out: 'Steps: 8'
      - set: n = 7
        out: 'Steps: 16'
      hints:
      - en: 'The loop condition is <code>n != 1</code>. Inside it you need a decision (even or odd) and a counter that goes up by one every round.'
      - en: 'Even: <code>n //= 2</code>. Odd: <code>n = 3 * n + 1</code>. Add one to <code>steps</code> after either branch.'
