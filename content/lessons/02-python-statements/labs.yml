  8:
    exercises:
    - id: e1
      prompt:
        en: 'The heart of the Guessing Game. Write <code>feedback(guess, secret, previous_guess=None)</code>. For the first guess return <code>"WARM!"</code> if it is within 10 of the secret, otherwise <code>"COLD!"</code>. For later guesses return <code>"WARMER!"</code> if closer than the previous guess, <code>"COLDER!"</code> if farther, and <code>"SAME DISTANCE!"</code> if equal.'
      starter: |
        def feedback(guess, secret, previous_guess=None):
            # your code here
            return "COLD!"
      solution: |
        def feedback(guess, secret, previous_guess=None):
            if previous_guess is None:
                return "WARM!" if abs(guess - secret) <= 10 else "COLD!"
            current = abs(guess - secret)
            previous = abs(previous_guess - secret)
            if current < previous:
                return "WARMER!"
            if current > previous:
                return "COLDER!"
            return "SAME DISTANCE!"
      tests:
      - post: |-
          print(feedback(50, 55))
          print(feedback(10, 55))
          print(feedback(65, 55))
          print(feedback(50, 55, previous_guess=10))
          print(feedback(10, 55, previous_guess=50))
          print(feedback(45, 55, previous_guess=65))
        out: |-
          WARM!
          COLD!
          WARM!
          WARMER!
          COLDER!
          SAME DISTANCE!
      hints:
      - en: 'Two cases: <code>previous_guess is None</code> means this is the first guess. Handle it first and return.'
      - en: 'The distance from the secret is <code>abs(guess - secret)</code>. Compare the distance of the new guess with the distance of the previous guess.'
      - en: 'After the first-guess case, compute <code>current</code> and <code>previous</code> distances, then return <code>WARMER!</code>, <code>COLDER!</code> or <code>SAME DISTANCE!</code>.'
