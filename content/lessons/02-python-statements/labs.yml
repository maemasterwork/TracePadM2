    - id: p3
      tag: digit-loop
      code: |-
        n = 90517
        digit_sum = 0
        reversed_n = 0
        while n > 0:
            digit = n % 10
            digit_sum += digit
            reversed_n = reversed_n * 10 + digit
            n //= 10
        print(digit_sum, reversed_n)
      answer: 22 71509
      why:
        en: '<code>n % 10</code> is the last digit and <code>n //= 10</code> removes it. Each round adds the digit to the sum and to the end of the reversed number.'
    - id: p4
      tag: loop-count
      code: |-
        n = 1000
        steps = 0
        while n > 1:
            n //= 2
            steps += 1
        print(steps)
      answer: '9'
      why:
        en: 1000 becomes 500, 250, 125, 62, 31, 15, 7, 3 and 1, which is 9 halvings. The number of halvings is about log<sub>2</sub> of the start value.
    - id: p5
      tag: gcd
      code: |-
        a, b = 84, 36
        while b != 0:
            a, b = b, a % b
        print(a)
      answer: '12'
      why:
        en: This is Euclid's method. (84, 36) becomes (36, 12) and then (12, 0), and the loop stops with the greatest common divisor 12 in <code>a</code>.
    - id: p6
      tag: break-in-while
      code: |-
        n = 10
        while n > 0:
            n -= 3
            if n == 4:
                break
        print(n)
      answer: '4'
      why:
        en: n goes 10, 7, 4. When it reaches 4 the <code>break</code> leaves the loop at once, so 4 is printed (not a negative number).
