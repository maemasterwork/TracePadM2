# Learner-visible text has en (fa optional). HTML in text is limited to code, em, strong, br (see tools/content/labs.schema.json).
lesson: 02-python-statements
schema: 1
chapters:
  1:
    predictions:
    - id: p1
      tag: indentation
      code: |-
        age = 20
        if age >= 18:
            print("adult")
            print("can vote")
        print("always")
      answer: |-
        adult
        can vote
        always
      why:
        en: Both indented lines belong to the <code>if</code> block and run because the condition is true. The last line is back at the left edge, so it is outside the block and runs every time.
    - id: p2
      tag: nested-if
      code: |-
        temperature = 28
        is_raining = False
        if temperature > 25:
            print("It's warm.")
            if is_raining:
                print("Take an umbrella.")
            else:
                print("Enjoy the sun!")
      answer: |-
        It's warm.
        Enjoy the sun!
      why:
        en: The outer condition is true (28 > 25), so its block runs. Inside it, <code>is_raining</code> is <code>False</code>, so the <code>else</code> part of the inner <code>if</code> runs.
    - id: p3
      tag: while-trace
      code: |-
        count = 0
        while count < 3:
            print("count is", count)
            count += 1
        print("finished")
      answer: |-
        count is 0
        count is 1
        count is 2
        finished
      why:
        en: The loop body runs while <code>count</code> is below 3, so it prints 0, 1 and 2. When <code>count</code> reaches 3 the condition is false, the loop ends, and the unindented line runs once.
    quizzes:
    - id: q1
      tag: statement-vs-expression
      question:
        en: 'Which of these is an expression (it produces a value you could put on the right of <code>=</code>)?'
      options:
      - en: '<code>x = 5</code>'
      - en: '<code>5 * 2</code>'
      - en: '<code>if x:</code>'
      - en: '<code>import math</code>'
      correct: 1
      why:
        en: '<code>5 * 2</code> produces the value 10. Assignment, <code>if</code> and <code>import</code> are statements that perform an action.'
    - id: q2
      tag: pass-statement
      question:
        en: What does <code>pass</code> do?
      options:
      - en: It ends the program
      - en: It skips to the next loop round
      - en: It does nothing; it is a placeholder where a statement is required
      - en: It raises an error
      correct: 2
      why:
        en: A block needs at least one statement. <code>pass</code> fills the gap while you are still working on the rest. Skipping to the next round is <code>continue</code>.
    - id: q3
      tag: indentation
      question:
        en: What is the standard indentation for one level in Python code?
      options:
      - en: 1 tab mixed with spaces
      - en: 2 spaces
      - en: 4 spaces
      - en: 8 spaces
      correct: 2
      why:
        en: The standard (PEP 8) is 4 spaces per level, and tabs and spaces must never be mixed in the same block.
    exercises:
    - id: e1
      prompt:
        en: 'The indentation is missing, so this program stops with an <code>IndentationError</code>. Indent it so that <em>"It''s hot!"</em> and <em>"Drink water."</em> belong to the <code>if</code> block, but <em>"Have a nice day."</em> always runs.'
      starter: |
        temperature = 31
        if temperature > 30:
        print("It's hot!")
        print("Drink water.")
        print("Have a nice day.")
      solution: |
        temperature = 31
        if temperature > 30:
            print("It's hot!")
            print("Drink water.")
        print("Have a nice day.")
      param:
        pattern: ^temperature\s*=.*$
        flags: m
      tests:
      - out: |-
          It's hot!
          Drink water.
          Have a nice day.
      - set: temperature = 20
        out: Have a nice day.
      - set: temperature = 30
        out: Have a nice day.
      hints:
      - en: Lines that belong to a block are indented by the same amount, 4 spaces, under the line that ends with a colon.
      - en: Indent the two lines about heat and water. Leave the last line at the left edge so it is outside the block.
    - id: e2
      prompt:
        en: 'Write the decision from the lesson. If <code>withdrawal</code> is not more than <code>balance</code>, subtract it and print <code>Done. New balance: ...</code>. Otherwise print <code>Insufficient funds. You are short by ...</code> with the missing amount.'
      starter: |
        balance = 250
        withdrawal = 300

        # your if / else here
      solution: |
        balance = 250
        withdrawal = 300

        if withdrawal <= balance:
            balance -= withdrawal
            print(f"Done. New balance: {balance}")
        else:
            print(f"Insufficient funds. You are short by {withdrawal - balance}.")
      param:
        pattern: ^balance = .*\nwithdrawal = .*$
        flags: m
      tests:
      - out: Insufficient funds. You are short by 50.
      - set: |-
          balance = 250
          withdrawal = 100
        out: 'Done. New balance: 150'
      - set: |-
          balance = 80
          withdrawal = 80
        out: 'Done. New balance: 0'
      hints:
      - en: You need a two-way decision, so use <code>if</code> and <code>else</code>. The condition is that the withdrawal fits in the balance.
      - en: '<code>withdrawal &lt;= balance</code> is the condition. In the <code>if</code> part change <code>balance</code> and print it; in the <code>else</code> part print how far short you are.'
  2:
    predictions:
    - id: p1
      tag: elif-chain
      code: |-
        score = 82
        if score >= 90:
            grade = "A"
        elif score >= 80:
            grade = "B"
        elif score >= 70:
            grade = "C"
        else:
            grade = "F"
        print(grade)
      answer: B
      why:
        en: Python checks the conditions from the top and runs only the first block whose condition is true. 82 is not at least 90, but it is at least 80, so the grade is B and the rest are skipped.
    - id: p2
      tag: elif-order
      code: |-
        score = 95
        if score >= 60:
            print("D")
        elif score >= 90:
            print("A")
      answer: D
      why:
        en: The broad condition <code>score &gt;= 60</code> is checked first and is true, so its block runs and the <code>elif</code> is never looked at. Put the most specific condition first.
    - id: p3
      tag: or-trap
      code: |-
        x = 5
        if x == 1 or 2:
            print("yes")
        else:
            print("no")
      answer: 'yes'
      why:
        en: '<code>x == 1 or 2</code> means <code>(x == 1) or 2</code>. The number 2 is always truthy, so the condition is always true. Write <code>x in (1, 2)</code> instead.'
    - id: p4
      tag: truthiness
      code: |-
        x = 0
        if x:
            print("A")
        elif x == 0:
            print("B")
        else:
            print("C")
      answer: B
      why:
        en: The number 0 is falsy, so <code>if x:</code> is false. The next condition <code>x == 0</code> is true, so B is printed.
    - id: p5
      tag: chained-comparison
      code: |-
        x = 15
        print(10 < x < 20, x % 5 == 0 and x > 20, "a" in "banana")
      answer: True False True
      why:
        en: Chained comparisons read like maths, so <code>10 &lt; x &lt; 20</code> is true. In the second part <code>x &gt; 20</code> is false, so the <code>and</code> is false. <code>"a"</code> is a substring of <code>"banana"</code>.
    - id: p6
      tag: ternary
      code: |-
        age = 17
        status = "adult" if age >= 18 else "minor"
        print(status)
      answer: minor
      why:
        en: A conditional expression picks one of two values. The condition <code>age &gt;= 18</code> is false, so the value after <code>else</code> is used.
    quizzes:
    - id: q1
      tag: or-trap
      question:
        en: Which condition correctly tests whether <code>x</code> is 1 or 2?
      options:
      - en: '<code>x == 1 or 2</code>'
      - en: '<code>x in (1, 2)</code>'
      - en: '<code>x = 1 or 2</code>'
      - en: '<code>x == 1 | 2</code>'
      correct: 1
      why:
        en: '<code>x in (1, 2)</code> checks membership. <code>x == 1 or 2</code> is always true, <code>=</code> assigns instead of comparing, and <code>1 | 2</code> is the number 3.'
    - id: q2
      tag: equals-vs-assign
      question:
        en: Which line is a <code>SyntaxError</code>?
      options:
      - en: '<code>if x == 5:</code>'
      - en: '<code>if x = 5:</code>'
      - en: '<code>if x != 5:</code>'
      - en: '<code>if not x:</code>'
      correct: 1
      why:
        en: A single <code>=</code> assigns, and an assignment is not allowed as an <code>if</code> condition. Use <code>==</code> to compare.
    - id: q3
      tag: truthiness
      question:
        en: What is the preferred way to check that a list called <code>items</code> is not empty?
      options:
      - en: '<code>if items == True:</code>'
      - en: '<code>if len(items) &gt; 0 == True:</code>'
      - en: '<code>if items:</code>'
      - en: '<code>if items is not []:</code>'
      correct: 2
      why:
        en: An empty list is falsy and a non-empty list is truthy, so <code>if items:</code> says it directly. Never compare with <code>is</code> to a new empty list.
    exercises:
    - id: e1
      prompt:
        en: 'Leap years. A year is a leap year if it is divisible by 4 and not by 100, or if it is divisible by 400. Print <code>2100 is a leap year</code> or <code>2100 is not a leap year</code> (using the value of <code>year</code>).'
      starter: |
        year = 2100

        # your if / else here
      solution: |
        year = 2100

        if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
            print(f"{year} is a leap year")
        else:
            print(f"{year} is not a leap year")
      param:
        pattern: ^year\s*=.*$
        flags: m
      tests:
      - out: 2100 is not a leap year
      - set: year = 2024
        out: 2024 is a leap year
      - set: year = 2000
        out: 2000 is a leap year
      - set: year = 1900
        out: 1900 is not a leap year
      - set: year = 2023
        out: 2023 is not a leap year
      hints:
      - en: There are two ways to be a leap year. Join them with <code>or</code>.
      - en: 'The first way needs two things at once: <code>year % 4 == 0 and year % 100 != 0</code>. The second way is <code>year % 400 == 0</code>.'
      - en: Put the whole condition after <code>if</code>, using parentheses around the first way, and print in both branches.
    - id: e2
      prompt:
        en: 'Write <code>describe(age)</code> with guard clauses. It returns <code>"invalid"</code> for a negative age, <code>"child"</code> below 13, <code>"teen"</code> below 20, and <code>"adult"</code> otherwise.'
      starter: |
        def describe(age):
            # your code here
            return "adult"
      solution: |
        def describe(age):
            if age < 0:
                return "invalid"
            if age < 13:
                return "child"
            if age < 20:
                return "teen"
            return "adult"
      tests:
      - post: |-
          print(describe(-5), describe(0), describe(12))
          print(describe(13), describe(19), describe(20), describe(70))
        out: |-
          invalid child child
          teen teen adult adult
      hints:
      - en: Start with the most unusual case, the invalid one, and return straight away.
      - en: 'Each check can be a separate <code>if ...: return ...</code>. Because a <code>return</code> ends the function, you do not need <code>elif</code> or <code>else</code>.'
  3:
    predictions:
    - id: p1
      tag: range-stop
      code: print(list(range(2, 10, 3)), list(range(5, 0, -2)))
      answer: '[2, 5, 8] [5, 3, 1]'
      why:
        en: '<code>range</code> stops before the end value. Starting at 2 and stepping by 3 gives 2, 5, 8 (the next, 11, is past 10). Counting down from 5 by 2 gives 5, 3, 1.'
    - id: p2
      tag: loop-continue
      code: |-
        for n in range(1, 8):
            if n % 2 == 0:
                continue
            print(n, end=" ")
      answer: 1 3 5 7
      why:
        en: '<code>continue</code> skips the rest of that round, so even numbers are never printed. <code>end=" "</code> keeps the output on one line.'
    - id: p3
      tag: loop-else
      code: |-
        for n in [3, 5, 7]:
            if n % 2 == 0:
                print("Found an even number")
                break
        else:
            print("No even numbers")
      answer: No even numbers
      why:
        en: The <code>else</code> of a loop runs only when the loop was not ended by <code>break</code>. No number was even, so <code>break</code> never ran.
    - id: p4
      tag: nested-loops
      code: |-
        for i in range(3):
            for j in range(i):
                print(i, j)
      answer: |-
        1 0
        2 0
        2 1
      why:
        en: When <code>i</code> is 0 the inner loop has nothing to do (<code>range(0)</code> is empty). For 1 it runs once (j = 0) and for 2 twice (j = 0, 1).
    - id: p5
      tag: modify-while-iterating
      code: |-
        nums = [2, 4, 6, 8]
        for n in nums:
            if n % 2 == 0:
                nums.remove(n)
        print(nums)
      answer: '[4, 8]'
      why:
        en: Removing an item shifts the rest to the left, but the loop moves on to the next position, so it skips an item each time. Never change a list while you loop over it. Build a new list instead.
    - id: p6
      tag: zip-enumerate
      code: print(list(zip("ab", [1, 2, 3])), list(enumerate("xy", start=1)))
      answer: "[('a', 1), ('b', 2)] [(1, 'x'), (2, 'y')]"
      why:
        en: '<code>zip</code> pairs items and stops at the shortest input, so the 3 is dropped. <code>enumerate</code> pairs each item with a counter that starts where you say.'
    quizzes:
    - id: q1
      tag: range-stop
      question:
        en: How many numbers does <code>range(0, 100, 7)</code> produce?
      options:
      - en: '14'
      - en: '15'
      - en: '16'
      - en: '100'
      correct: 1
      why:
        en: 0, 7, 14, ... 98 is 15 numbers (0 up to 14 &times; 7). Use <code>len(range(...))</code> to check without building a list.
    - id: q2
      tag: loop-break-nested
      question:
        en: In nested loops, what does <code>break</code> in the inner loop do?
      options:
      - en: Leaves both loops
      - en: Leaves only the inner loop
      - en: Skips one round of the outer loop
      - en: Stops the program
      correct: 1
      why:
        en: '<code>break</code> only exits the innermost loop. To leave both, use a flag variable or put the loops in a function and <code>return</code>.'
    - id: q3
      tag: loop-else
      question:
        en: When does the <code>else</code> block of a <code>for</code> loop run?
      options:
      - en: Only when the list is empty
      - en: Every time, after the loop
      - en: When the loop finished without hitting <code>break</code>
      - en: When an error happens
      correct: 2
      why:
        en: '<code>else</code> on a loop means "no break happened". An empty loop also finishes without a <code>break</code>, so its <code>else</code> runs too.'
    exercises:
    - id: e1
      prompt:
        en: 'Compute the factorial of <code>n</code> with a <code>for</code> loop and print it as <code>6! = 720</code>.'
      starter: |
        n = 6
        result = 1

        # your loop here

        print(f"{n}! = {result}")
      solution: |
        n = 6
        result = 1

        for i in range(2, n + 1):
            result *= i

        print(f"{n}! = {result}")
      param:
        pattern: ^n = .*$
        flags: m
      tests:
      - out: 6! = 720
      - set: n = 1
        out: 1! = 1
      - set: n = 0
        out: 0! = 1
      - set: n = 10
        out: 10! = 3628800
      hints:
      - en: 'A factorial is 1 &times; 2 &times; ... &times; n. This is an accumulator: start with 1 and multiply in each number.'
      - en: '<code>range(2, n + 1)</code> gives 2 up to n, because <code>range</code> stops before the end. For n = 0 or 1 it gives nothing and the answer stays 1.'
    - id: e2
      prompt:
        en: 'Count the vowels and the consonants (letters only) in <code>text</code> and print them as <code>6 13</code>. Ignore case.'
      starter: |
        text = "Learning Python is fun"
        vowels = 0
        consonants = 0

        # your loop here

        print(vowels, consonants)
      solution: |
        text = "Learning Python is fun"
        vowels = 0
        consonants = 0

        for ch in text.lower():
            if ch.isalpha():
                if ch in "aeiou":
                    vowels += 1
                else:
                    consonants += 1

        print(vowels, consonants)
      param:
        pattern: ^text = .*$
        flags: m
      tests:
      - out: 6 13
      - set: text = "AEIOU xyz"
        out: 5 3
      - set: text = "123 !!!"
        out: 0 0
      - set: text = "Python"
        out: 1 5
      hints:
      - en: Loop over the string (<code>.lower()</code> makes upper and lower case the same). Skip everything that is not a letter with <code>ch.isalpha()</code>.
      - en: Inside the letter check, use <code>if ch in "aeiou":</code> to count a vowel, and <code>else</code> to count a consonant.
