# Lesson 0 labs. Every learner-visible text has en and fa. HTML in text is limited to code, em, strong, br (see tools/content/labs.schema.json).
lesson: 00-flowcharts-made-easy
schema: 1
chapters:
  2:
    quizzes:
    - id: q1
      tag: flow-symbols
      question:
        en: Which shape stands for a decision, a yes/no question?
        fa: کدام شکل نمایندهٔ تصمیم است، یعنی یک پرسش بله/خیر؟
      options:
      - en: The rounded box (pill)
        fa: جعبهٔ گرد (قرصی)
      - en: The rectangle
        fa: مستطیل
      - en: The parallelogram
        fa: متوازی‌الاضلاع
      - en: The diamond
        fa: لوزی
      correct: 3
      why:
        en: The diamond is the question. It always has two exits, Yes and No, and in Python it becomes <code>if</code> or <code>while</code>.
        fa: لوزی همان پرسش است. همیشه دو خروجی دارد، بله و خیر، و در پایتون به <code>if</code> یا <code>while</code> تبدیل می‌شود.
    - id: q2
      tag: flow-symbols
      question:
        en: Which shape do you use for reading input or showing output (<code>input()</code> and <code>print()</code>)?
        fa: برای خواندن ورودی یا نشان دادن خروجی (<code>input()</code> و <code>print()</code>) از کدام شکل استفاده می‌کنید؟
      options:
      - en: The rectangle
        fa: مستطیل
      - en: The diamond
        fa: لوزی
      - en: The parallelogram
        fa: متوازی‌الاضلاع
      - en: The pill
        fa: جعبهٔ قرصی
      correct: 2
      why:
        en: The slanted box is for data going in or out. A plain rectangle is for a calculation or other action, such as <code>x = x + 1</code>.
        fa: جعبهٔ مورب برای داده‌ای است که وارد یا خارج می‌شود. مستطیل ساده برای محاسبه یا کارهای دیگر است، مثل <code>x = x + 1</code>.
    - id: q3
      tag: flow-rules
      question:
        en: How many exits must a diamond have?
        fa: یک لوزی باید چند خروجی داشته باشد؟
      options:
      - en: One
        fa: یک
      - en: Two, Yes and No
        fa: دو، بله و خیر
      - en: Three
        fa: سه
      - en: None
        fa: هیچ
      correct: 1
      why:
        en: A question has two answers, so draw both. A diamond with one exit hides what happens in the other case.
        fa: یک پرسش دو پاسخ دارد، پس هر دو را بکشید. لوزی با یک خروجی پنهان می‌کند که در حالت دیگر چه می‌شود.
  4:
    predictions:
    - id: p1
      tag: flow-sequence
      code: |-
        a = 2.5
        b = 4
        total = a + b
        print("Sum:", total)
      answer: 'Sum: 6.5'
      why:
        en: A sequence is read top to bottom, one box (one line) at a time. <code>total</code> is 2.5 + 4 = 6.5, and <code>print</code> shows the label and the value separated by a space.
        fa: دنباله از بالا به پایین و هر بار یک جعبه (یک خط) خوانده می‌شود. <code>total</code> برابر ۲٫۵ + ۴ = ۶٫۵ است و <code>print</code> برچسب و مقدار را با یک فاصله کنار هم نشان می‌دهد.
    quizzes:
    - id: q1
      tag: flow-sequence
      question:
        en: In a sequence, how many lines of code does one box usually become?
        fa: در یک دنباله، هر جعبه معمولاً چند خط کد می‌شود؟
      options:
      - en: One
        fa: یک
      - en: Three
        fa: سه
      - en: As many as you like
        fa: هر قدر بخواهید
      - en: None, boxes are only decoration
        fa: هیچ، جعبه‌ها فقط تزئینی‌اند
      correct: 0
      why:
        en: Keep each box to one simple action, and each box turns into exactly one line of code.
        fa: هر جعبه را به یک کار ساده محدود کنید، آن‌وقت هر جعبه دقیقاً یک خط کد می‌شود.
    exercises:
    - id: e1
      prompt:
        en: 'Turn the flowchart into code. The boxes are: read <code>a</code> and <code>b</code> (already given), then <code>total = a + b</code>, then show it. Print <code>Sum: 12</code> for a = 7 and b = 5.'
        fa: 'فلوچارت را به کد تبدیل کنید. جعبه‌ها این‌ها هستند: خواندن <code>a</code> و <code>b</code> (از قبل داده شده)، بعد <code>total = a + b</code>، بعد نشان دادن آن. برای a = 7 و b = 5 باید <code>Sum: 12</code> چاپ شود.'
      starter: |
        a = 7
        b = 5

        # box: total = a + b
        # box: print "Sum:" and total
      solution: |
        a = 7
        b = 5

        total = a + b
        print("Sum:", total)
      param:
        pattern: ^a = .*\nb = .*$
        flags: m
      tests:
      - out: 'Sum: 12'
      - set: |-
          a = 2
          b = 3
        out: 'Sum: 5'
      - set: |-
          a = -4
          b = 4
        out: 'Sum: 0'
      hints:
      - en: Each box becomes one line. The first box is an assignment.
        fa: هر جعبه یک خط می‌شود. اولین جعبه یک انتساب است.
      - en: Write <code>total = a + b</code> and then <code>print("Sum:", total)</code>.
        fa: بنویسید <code>total = a + b</code> و بعد <code>print("Sum:", total)</code>.
  5:
    predictions:
    - id: p1
      tag: flow-decision
      code: |-
        n = 7
        if n % 2 == 0:
            print("Even")
        else:
            print("Odd")
      answer: Odd
      why:
        en: The diamond asks <code>n % 2 == 0</code>. 7 leaves a remainder of 1, so the answer is No and the <code>else</code> branch runs.
        fa: لوزی می‌پرسد <code>n % 2 == 0</code>. عدد ۷ باقی‌ماندهٔ ۱ دارد، پس پاسخ خیر است و شاخهٔ <code>else</code> اجرا می‌شود.
    - id: p2
      tag: flow-elif-chain
      code: |-
        score = 85
        if score >= 90:
            print("A")
        elif score >= 80:
            print("B")
        elif score >= 70:
            print("C")
        else:
            print("F")
      answer: B
      why:
        en: The first diamond (90 or more) says No, the second one (80 or more) says Yes, so B is printed and the rest of the chain is skipped.
        fa: لوزی اول (۹۰ یا بیشتر) می‌گوید خیر و دومی (۸۰ یا بیشتر) می‌گوید بله، پس B چاپ می‌شود و بقیهٔ زنجیره رد می‌شود.
    - id: p3
      tag: flow-elif-chain
      code: |-
        score = 65
        if score >= 90:
            print("A")
        elif score >= 80:
            print("B")
        elif score >= 70:
            print("C")
        else:
            print("F")
      answer: F
      why:
        en: Every diamond answers No, so the flow follows the last No exit, which is the <code>else</code>.
        fa: همهٔ لوزی‌ها جواب خیر می‌دهند، پس جریان آخرین خروجی خیر را دنبال می‌کند که همان <code>else</code> است.
    quizzes:
    - id: q1
      tag: flow-elif-chain
      question:
        en: A chain of diamonds, each on the No exit of the one before, becomes...
        fa: زنجیره‌ای از لوزی‌ها که هر کدام روی خروجی خیرِ قبلی است، می‌شود...
      options:
      - en: a <code>while</code> loop
        fa: یک حلقهٔ <code>while</code>
      - en: <code>if ... elif ... else</code>
        fa: <code>if ... elif ... else</code>
      - en: a function
        fa: یک تابع
      - en: a <code>for</code> loop
        fa: یک حلقهٔ <code>for</code>
      correct: 1
      why:
        en: The first diamond is <code>if</code>, the next ones are <code>elif</code>, and the last No exit is <code>else</code>.
        fa: اولین لوزی <code>if</code> است، بعدی‌ها <code>elif</code> هستند و آخرین خروجی خیر <code>else</code> است.
    exercises:
    - id: e1
      prompt:
        en: 'Practice exercise 1. Write <code>sign(n)</code> that returns <code>"positive"</code>, <code>"negative"</code> or <code>"zero"</code>. (Draw the flowchart first: two diamonds.)'
        fa: 'تمرین ۱. تابع <code>sign(n)</code> را بنویسید که <code>"positive"</code>، <code>"negative"</code> یا <code>"zero"</code> را برگرداند. (اول فلوچارت را بکشید: دو لوزی.)'
      starter: |
        def sign(n):
            # your code here
            return "zero"
      solution: |
        def sign(n):
            if n > 0:
                return "positive"
            elif n < 0:
                return "negative"
            else:
                return "zero"
      tests:
      - post: print(sign(5), sign(-3), sign(0), sign(0.5))
        out: positive negative zero positive
      hints:
      - en: 'Two questions are enough: <code>n &gt; 0</code> and <code>n &lt; 0</code>. Whatever is left is zero.'
        fa: 'دو پرسش کافی است: <code>n &gt; 0</code> و <code>n &lt; 0</code>. هر چه باقی بماند صفر است.'
      - en: Use <code>if</code> for the first question, <code>elif</code> for the second, and <code>else</code> for zero.
        fa: برای پرسش اول <code>if</code>، برای دومی <code>elif</code> و برای صفر <code>else</code> بگذارید.
  6:
    predictions:
    - id: p1
      tag: flow-while
      code: |-
        i = 1
        while i <= 5:
            print(i)
            i = i + 1
      answer: |-
        1
        2
        3
        4
        5
      why:
        en: The diamond <code>i &lt;= 5</code> is asked before every round. When <code>i</code> becomes 6 the answer is No and the flow leaves the loop.
        fa: لوزی <code>i &lt;= 5</code> پیش از هر دور پرسیده می‌شود. وقتی <code>i</code> برابر ۶ شود پاسخ خیر است و جریان از حلقه بیرون می‌رود.
    - id: p2
      tag: flow-loop-update
      code: |-
        i = 1
        while i <= 5:
            i = i + 2
        print(i)
      answer: '7'
      why:
        en: <code>i</code> goes 1, 3, 5, 7. At 5 the question is still Yes, so it becomes 7, and then the question is No. The arrow back up runs three times.
        fa: '<code>i</code> این مقدارها را می‌گیرد: ۱، ۳، ۵، ۷. در ۵ پرسش هنوز بله است، پس ۷ می‌شود و بعد پرسش خیر است. پیکان بازگشت سه بار اجرا می‌شود.'
    - id: p3
      tag: flow-password-loop
      code: |-
        secret = "python123"
        attempts = ["abc", "123", "python123"]
        position = 0
        password = attempts[position]

        while password != secret:
            print("Wrong, try again")
            position += 1
            password = attempts[position]

        print("Welcome!")
      answer: |-
        Wrong, try again
        Wrong, try again
        Welcome!
      why:
        en: The loop goes back to read a new password until it matches. The first two attempts are wrong, the third is right, so the loop is left and Welcome is printed.
        fa: حلقه برمی‌گردد و رمز تازه می‌خواند تا زمانی که درست شود. دو تلاش اول اشتباه است و سومی درست، پس از حلقه خارج می‌شود و Welcome چاپ می‌شود.
    quizzes:
    - id: q1
      tag: flow-while
      question:
        en: In a flowchart, what makes a loop?
        fa: در فلوچارت، چه چیزی یک حلقه می‌سازد؟
      options:
      - en: A special loop shape
        fa: یک شکل ویژهٔ حلقه
      - en: An arrow that goes back up to an earlier step
        fa: پیکانی که به یک گام قبلی برمی‌گردد
      - en: Two diamonds side by side
        fa: دو لوزی کنار هم
      - en: A rectangle with double bars
        fa: مستطیلی با نوارهای دوتایی
      correct: 1
      why:
        en: A loop is simply an arrow that returns to an earlier box. With a diamond at the top of the loop it is a <code>while</code>.
        fa: حلقه فقط پیکانی است که به یک جعبهٔ قبلی برمی‌گردد. اگر در بالای حلقه یک لوزی باشد، <code>while</code> است.
    - id: q2
      tag: flow-for-vs-while
      question:
        en: When is <code>while</code> a better fit than <code>for</code>?
        fa: چه وقت <code>while</code> مناسب‌تر از <code>for</code> است؟
      options:
      - en: When you know exactly how many times to repeat
        fa: وقتی دقیقاً می‌دانید چند بار تکرار شود
      - en: When you repeat until something happens, such as a correct password
        fa: وقتی تکرار می‌کنید تا اتفاقی بیفتد، مثلاً درست شدن رمز عبور
      - en: Never, <code>for</code> can do everything
        fa: هرگز، <code>for</code> همه‌چیز را می‌تواند
      - en: When there are no numbers
        fa: وقتی عددی در کار نیست
      correct: 1
      why:
        en: Use <code>for</code> when you know how many times, and <code>while</code> when you repeat until something happens.
        fa: وقتی می‌دانید چند بار تکرار می‌شود از <code>for</code> استفاده کنید و وقتی تکرار می‌کنید تا اتفاقی بیفتد از <code>while</code>.
    exercises:
    - id: e1
      prompt:
        en: Practice exercise 2. Print the multiplication table of <code>n</code> from 1 to 10, one line per row in the form <code>7 x 1 = 7</code>.
        fa: تمرین ۲. جدول ضرب <code>n</code> را از ۱ تا ۱۰ چاپ کنید، هر سطر در یک خط و به شکل <code>7 x 1 = 7</code>.
      starter: |
        n = 7

        # your loop here
      solution: |
        n = 7

        for i in range(1, 11):
            print(f"{n} x {i} = {n * i}")
      param:
        pattern: ^n = .*$
        flags: m
      tests:
      - out: |-
          7 x 1 = 7
          7 x 2 = 14
          7 x 3 = 21
          7 x 4 = 28
          7 x 5 = 35
          7 x 6 = 42
          7 x 7 = 49
          7 x 8 = 56
          7 x 9 = 63
          7 x 10 = 70
      - set: n = 1
        out: |-
          1 x 1 = 1
          1 x 2 = 2
          1 x 3 = 3
          1 x 4 = 4
          1 x 5 = 5
          1 x 6 = 6
          1 x 7 = 7
          1 x 8 = 8
          1 x 9 = 9
          1 x 10 = 10
      hints:
      - en: You know how many times to repeat (ten), so a <code>for</code> loop fits.
        fa: می‌دانید چند بار تکرار می‌شود (ده بار)، پس حلقهٔ <code>for</code> مناسب است.
      - en: <code>range(1, 11)</code> gives 1 to 10. In each round print <code>n</code>, the counter and their product.
        fa: <code>range(1, 11)</code> اعداد ۱ تا ۱۰ را می‌دهد. در هر دور <code>n</code>، شمارنده و حاصل‌ضرب‌شان را چاپ کنید.
  7:
    predictions:
    - id: p1
      tag: flow-function
      code: |-
        def add_tax(price):
            print("inside")
            return price + 10

        print("before")
        print(add_tax(5))
