        fa: ۳ از ۷ کمتر است، ۹ از آن بیشتر است و حدس سوم با عدد مخفی برابر است، پس پیام بردن چاپ می‌شود و برنامه با <code>break</code> از حلقه بیرون می‌رود.
  11:
    quizzes:
    - id: q1
      tag: flow-mistakes
      question:
        en: A loop in your flowchart never ends. What is the usual fix?
        fa: حلقهٔ فلوچارت شما هرگز تمام نمی‌شود. راه‌حل معمول چیست؟
      options:
      - en: Add more diamonds
        fa: لوزی‌های بیشتری اضافه کنید
      - en: Make sure something inside the loop changes the condition
        fa: مطمئن شوید چیزی داخل حلقه شرط را عوض می‌کند
      - en: Remove the Start box
        fa: جعبهٔ شروع را حذف کنید
      - en: Use a rectangle instead of a diamond
        fa: به‌جای لوزی از مستطیل استفاده کنید
      correct: 1
      why:
        en: If nothing in the loop changes what the diamond asks, the answer never changes. For example, add <code>i = i + 1</code>.
        fa: اگر چیزی داخل حلقه آنچه را لوزی می‌پرسد تغییر ندهد، پاسخ هیچ‌وقت عوض نمی‌شود. مثلاً <code>i = i + 1</code> را اضافه کنید.
    - id: q2
      tag: flow-mistakes
      question:
        en: What should the text in a flowchart box look like?
        fa: متن داخل جعبه‌های فلوچارت چه شکلی باید باشد؟
      options:
      - en: Exact Python syntax
        fa: نحو دقیق پایتون
      - en: Plain language, one action ("Add tax")
        fa: زبان ساده، یک کار («مالیات اضافه کن»)
      - en: A whole paragraph
        fa: یک پاراگراف کامل
      - en: Only numbers
        fa: فقط عدد
      correct: 1
      why:
        en: A flowchart shows the logic, not the syntax. Plain words keep it readable, and one action per box keeps it simple.
        fa: فلوچارت منطق را نشان می‌دهد، نه نحو را. کلمات ساده آن را خوانا نگه می‌دارند و یک کار در هر جعبه آن را ساده.
  12:
    exercises:
    - id: e1
      prompt:
        en: Practice exercise 3. Write <code>total_until_zero(numbers)</code> that adds the numbers in the list until it reaches a <code>0</code> and returns the total (the <code>0</code> and anything after it are ignored).
        fa: تمرین ۳. تابع <code>total_until_zero(numbers)</code> را بنویسید که عددهای فهرست را جمع کند تا به <code>0</code> برسد و مجموع را برگرداند (خودِ <code>0</code> و هر چه بعد از آن است نادیده گرفته می‌شود).
      starter: |
        def total_until_zero(numbers):
            # your code here
            return 0
      solution: |
        def total_until_zero(numbers):
            total = 0
            for n in numbers:
                if n == 0:
                    break
                total += n
            return total
      tests:
      - post: |-
          print(total_until_zero([5, 10, 0, 99]))
          print(total_until_zero([0, 4]))
          print(total_until_zero([3, -1, 2]))
        out: |-
          15
          0
          4
      hints:
      - en: Start a total at 0 and look at the numbers one at a time.
        fa: مجموع را از ۰ شروع کنید و عددها را یکی‌یکی ببینید.
      - en: When a number is <code>0</code>, leave the loop with <code>break</code>. Otherwise add it to the total.
        fa: وقتی عددی <code>0</code> بود با <code>break</code> از حلقه بیرون بروید. وگرنه آن را به مجموع اضافه کنید.
    - id: e2
      prompt:
        en: Practice exercise 4. Write <code>largest(a, b, c)</code> that returns the largest of three numbers without using <code>max</code>.
        fa: تمرین ۴. تابع <code>largest(a, b, c)</code> را بنویسید که بزرگ‌ترین از سه عدد را بدون استفاده از <code>max</code> برگرداند.
      starter: |
        def largest(a, b, c):
            # your code here
            return a
      solution: |
        def largest(a, b, c):
            if a >= b and a >= c:
                return a
            elif b >= c:
                return b
            else:
                return c
      tests:
      - post: |-
          print(largest(1, 2, 3), largest(3, 2, 1), largest(2, 3, 1))
          print(largest(5, 5, 5), largest(-1, -2, -3), largest(0, 7, 7))
        out: |-
          3 3 3
          5 -1 7
      hints:
      - en: Ask "is a at least as big as both of the others?" first.
        fa: اول بپرسید «آیا a دست‌کم به اندازهٔ هر دو عدد دیگر بزرگ است؟»
      - en: If not, the answer is b or c. One more question, <code>b &gt;= c</code>, decides between them.
        fa: اگر نه، پاسخ b یا c است. یک پرسش دیگر، <code>b &gt;= c</code>، بین آن دو تصمیم می‌گیرد.
    - id: e3
      prompt:
        en: Practice exercise 5. Write <code>is_prime(n)</code> that returns <code>True</code> if <code>n</code> is a prime number and <code>False</code> otherwise (numbers below 2 are not prime).
        fa: تمرین ۵. تابع <code>is_prime(n)</code> را بنویسید که اگر <code>n</code> عدد اول است <code>True</code> و در غیر این صورت <code>False</code> برگرداند (عددهای کوچک‌تر از ۲ اول نیستند).
      starter: |
        def is_prime(n):
            # your code here
            return False
      solution: |
        def is_prime(n):
            if n < 2:
                return False
            d = 2
            while d * d <= n:
                if n % d == 0:
                    return False
                d += 1
            return True
      tests:
      - post: |-
          print([n for n in range(0, 20) if is_prime(n)])
          print(is_prime(97), is_prime(91), is_prime(2))
        out: |-
          [2, 3, 5, 7, 11, 13, 17, 19]
          True False True
      hints:
      - en: Numbers below 2 are not prime, so answer that case first.
        fa: عددهای کوچک‌تر از ۲ اول نیستند، پس اول همین حالت را جواب بدهید.
      - en: Try dividers <code>d</code> from 2 upwards. If <code>n % d == 0</code> for any of them, it is not prime. You can stop when <code>d * d</code> is bigger than <code>n</code>.
        fa: مقسوم‌علیه‌های <code>d</code> را از ۲ به بالا امتحان کنید. اگر به ازای یکی از آن‌ها <code>n % d == 0</code> بود، اول نیست. وقتی <code>d * d</code> از <code>n</code> بزرگ‌تر شد می‌توانید بایستید.
