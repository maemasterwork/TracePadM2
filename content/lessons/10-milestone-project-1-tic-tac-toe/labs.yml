      - en: An empty square holds <code>" "</code>. Return the comparison <code>board[position] == " "</code>.
    - id: e2
      prompt:
        en: 'Write <code>position_error(text, board)</code>. It returns <code>""</code> when <code>text</code> (spaces allowed around it) is a number from 1 to 9 for an empty square. Otherwise it returns one of: <code>Please type a number from 1 to 9.</code>, <code>The number must be from 1 to 9.</code>, <code>That square is already taken.</code>'
      starter: |-
        def space_check(board, position):
            return board[position] == " "


        def position_error(text, board):
            text = text.strip()
            if not text.isdecimal():
                return "Please type a number from 1 to 9."
            return ""
      solution: |-
        def space_check(board, position):
            return board[position] == " "


        def position_error(text, board):
            """Return why text is not a usable position, or '' if it is."""
            text = text.strip()
            if not text.isdecimal():
                return "Please type a number from 1 to 9."
            position = int(text)
            if not 1 <= position <= 9:
                return "The number must be from 1 to 9."
            if not space_check(board, position):
                return "That square is already taken."
            return ""
      tests:
      - post: |-
          b = [" "] * 10
          b[5] = "X"
          for t in ["3", " 7 ", "5", "0", "10", "abc", "", "-2", "5.5"]:
              print(repr(position_error(t, b)))
        out: |-
          ''
          ''
          'That square is already taken.'
          'The number must be from 1 to 9.'
          'The number must be from 1 to 9.'
          'Please type a number from 1 to 9.'
          'Please type a number from 1 to 9.'
          'Please type a number from 1 to 9.'
          'Please type a number from 1 to 9.'
      - post: |-
          b = [" "] * 10
          print(repr(position_error("9", b)))
        out: ''''''
        hidden: true
      hints:
      - en: 'Three rules, in this order: is it a whole number? is it from 1 to 9? is the square free?'
      - en: Strip the text first, check <code>isdecimal()</code>, convert with <code>int()</code>, then compare with the range.
      - en: Use the <code>space_check</code> function you already have for the last rule. Return <code>""</code> when all rules pass.
