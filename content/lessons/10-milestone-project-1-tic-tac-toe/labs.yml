      solution: |-
        WIN_LINES = [
            (1, 2, 3), (4, 5, 6), (7, 8, 9),
            (1, 4, 7), (2, 5, 8), (3, 6, 9),
            (1, 5, 9), (3, 5, 7),
        ]


        def win_check(board, mark):
            return any(all(board[i] == mark for i in line) for line in WIN_LINES)


        def full_board_check(board):
            return " " not in board[1:]


        def game_result(board, marker):
            """Return 'win', 'tie' or 'continue' after marker just moved."""
            if win_check(board, marker):
                return "win"
            if full_board_check(board):
                return "tie"
            return "continue"
      tests:
      - post: print(game_result(["#", "X", "X", "X", " ", " ", " ", " ", " ", " "], "X"))
        out: win
      - post: print(game_result(["#", "X", "O", "X", "X", "O", "O", "O", "X", "X"], "X"))
        out: tie
      - post: print(game_result(["#", "O", "X", "X", "X", "X", "O", "X", "O", "O"], "X"))
        out: win
      - post: print(game_result(["#", "X", "O", " ", " ", " ", " ", " ", " ", " "], "O"))
        out: continue
        hidden: true
      hints:
      - en: Three outcomes, and the order of the checks matters.
      - en: The starter checks for a full board first, so a winning last move is called a tie. Check the win first.
      - en: Win first, then full board, then <code>"continue"</code>.
