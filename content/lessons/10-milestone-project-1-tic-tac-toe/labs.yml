    exercises:
    - id: e1
      prompt:
        en: Write <code>display_board(board)</code>. It prints three rows, with a line <code>---+---+---</code> between them. Each square has a space before and after its symbol, like <code> X | O |   </code>.
      starter: |-
        def display_board(board):
            print(board)
      solution: |-
        def display_board(board):
            """Print the board as three rows of three squares."""
            print(f" {board[1]} | {board[2]} | {board[3]} ")
            print("---+---+---")
            print(f" {board[4]} | {board[5]} | {board[6]} ")
            print("---+---+---")
            print(f" {board[7]} | {board[8]} | {board[9]} ")
      tests:
      - post: display_board([" ", "X", "O", " ", " ", "X", " ", " ", " ", "O"])
        out: " X | O |   \n---+---+---\n   | X |   \n---+---+---\n   |   | O "
      - post: display_board([" "] * 10)
        out: "   |   |   \n---+---+---\n   |   |   \n---+---+---\n   |   |   "
      - post: display_board(["#", "1", "2", "3", "4", "5", "6", "7", "8", "9"])
        out: " 1 | 2 | 3 \n---+---+---\n 4 | 5 | 6 \n---+---+---\n 7 | 8 | 9 "
        hidden: true
      hints:
      - en: Square 1 is <code>board[1]</code>, not <code>board[0]</code>. Each row shows three squares.
      - en: 'Use one f-string per row: <code>f" {board[1]} | {board[2]} | {board[3]} "</code>.'
      - en: Print the three rows and put <code>print("---+---+---")</code> between them.
