chapters:
  1:
    quizzes:
    - id: q1
      tag: requirements
      question:
        en: Which requirement of the brief is about <em>input</em>?
      options:
      - en: The board is printed after every move
      - en: The program accepts the player's position
      - en: Two players sit at the same computer
      - en: A symbol is placed on the board
      correct: 1
      why:
        en: Reading the position the player types is the input requirement. Printing the board is output, and placing the symbol changes the board.
    - id: q2
      tag: design-is-yours
      question:
        en: The brief does not say how to store the board or which functions to write. What does that mean?
      options:
      - en: 'Nothing: the design is yours to choose'
      - en: You must ask the teacher
      - en: A list is the only allowed choice
      - en: The program cannot be written
      correct: 0
      why:
        en: A brief says <em>what</em> the program must do. How it is built is your design, as long as every requirement is met.
    - id: q3
      tag: extra-requirements
      question:
        en: R5 to R7 (win and tie, bad input, play again) are not in the brief. Why does the module include them?
      options:
      - en: They are required to pass
      - en: They turn the assignment into a game people can enjoy and trust
      - en: Python needs them
      - en: They make the program shorter
      correct: 1
      why:
        en: The brief is the minimum. A real game must decide winners and survive bad input.
