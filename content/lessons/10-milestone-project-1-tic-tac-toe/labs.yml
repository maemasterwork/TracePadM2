      answer: |-
        '5' True
        ' 5' False
        'five' False
        '' False
        '5.5' False
      why:
        en: <code>isdecimal()</code> is true only for a non-empty string made of digits. A space, a letter, a dot or an empty string make it false. This is why the text is stripped first.
    - id: p2
