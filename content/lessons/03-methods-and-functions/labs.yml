    exercises:
    - id: e1
      prompt:
        en: The function should add to the global <code>total</code> but crashes with <code>UnboundLocalError</code>. Fix it with the right keyword. After two calls it should print <code>15</code>.
      starter: |-
        total = 0

        def add(n):
            total += n

        add(5)
        add(10)
        print(total)
      solution: |-
        total = 0

        def add(n):
            global total
            total += n

        add(5)
        add(10)
        print(total)
      tests:
      - out: '15'
      hints:
