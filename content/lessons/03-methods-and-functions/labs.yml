    predictions:
    - id: p1
      tag: mutating-vs-new
      code: |-
        s = "python"
        s.upper()
        print(s)
      answer: python
      why:
        en: 'String methods never change the string: strings are immutable. <code>s.upper()</code> builds a new string, and because nothing stored it, it was thrown away. <code>s</code> is still <code>python</code>.'
    - id: p2
      tag: none-from-sort
      code: |-
        x = [3, 1, 2]
        y = x.sort()
        print(x, y)
      answer: '[1, 2, 3] None'
      why:
        en: <code>list.sort()</code> changes the list in place and returns <code>None</code>. So <code>x</code> is sorted and <code>y</code> is <code>None</code>.
    - id: p3
      tag: sorted-new-list
      code: |-
        nums = [3, 1, 2]
        result = sorted(nums)
        print(nums, result)
      answer: '[3, 1, 2] [1, 2, 3]'
      why:
        en: <code>sorted()</code> returns a new list and leaves the original alone, so <code>nums</code> keeps its order.
    - id: p4
      tag: chaining
      code: |-
        text = "  ali REZA  "
        print(text.strip().title().split())
      answer: '[''Ali'', ''Reza'']'
      why:
        en: 'Each method works on the result of the one before it: strip the spaces, capitalise each word, then split into a list of words.'
