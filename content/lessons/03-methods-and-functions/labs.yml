    - id: p1
      tag: print-vs-return
      code: |-
        def f(x):
            x = x + 1

        y = f(1)
        print(y)
      answer: None
      why:
        en: The function has no <code>return</code>, so it gives back <code>None</code>. Changing <code>x</code> inside has no effect on the outside. This is Try It question 2.
    - id: p2
      tag: default-args
      code: |-
        def greet(name, greeting="Hello"):
            return f"{greeting}, {name}!"

        print(greet("Sara"))
        print(greet("Ali", "Hi"))
        print(greet(greeting="Hey", name="Reza"))
      answer: |-
        Hello, Sara!
        Hi, Ali!
        Hey, Reza!
      why:
        en: A missing argument uses its default. Keyword arguments are matched by name, so their order does not matter.
    - id: p3
      tag: mutable-default
      code: |-
        def add(item, bag=[]):
            bag.append(item)
            return bag

        print(add(1))
        print(add(2))
      answer: |-
        [1]
        [1, 2]
      why:
        en: The default list is created once, when the function is defined, and shared by every call that does not pass its own list. The second call adds to the same list.
    - id: p4
      tag: multiple-returns
      code: |-
        def min_max(nums):
            return min(nums), max(nums)

        lo, hi = min_max([4, 9, 1, 7])
        print(lo, hi)
        print(min_max([5]))
      answer: |-
        1 9
        (5, 5)
      why:
        en: Returning two values returns one tuple, which you can unpack. For a one-item list min and max are the same.
    - id: p5
      tag: recursion
      code: |-
        def countdown(n):
            if n == 0:
                print("go")
                return
            print(n)
            countdown(n - 1)

        countdown(3)
      answer: |-
        3
        2
        1
        go
      why:
        en: Each call prints and then calls itself with a smaller number. When <code>n</code> reaches 0 (the base case), it prints <code>go</code> and the calls stop.
    - id: p6
      tag: side-effect
      code: |-
        def add_one(items):
            items.append(1)

        data = []
        add_one(data)
        add_one(data)
        print(data)
      answer: '[1, 1]'
      why:
        en: 'The function receives the same list object, not a copy. Appending inside changes the list outside as well: a side effect.'
