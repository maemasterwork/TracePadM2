    - id: p3
      tag: global-keyword
      code: |-
        count = 0

        def bump():
            global count
            count += 1

        bump()
        bump()
        print(count)
      answer: '2'
      why:
        en: <code>global count</code> makes the name inside the function refer to the module-level variable, so both calls change it.
    - id: p4
      tag: nonlocal-closure
      code: |-
        def make_counter():
            n = 0
            def counter():
                nonlocal n
                n += 1
                return n
            return counter

        c = make_counter()
        print(c(), c(), c())
      answer: 1 2 3
      why:
        en: <code>counter</code> remembers <code>n</code> from the function that created it (a closure). <code>nonlocal</code> lets it update that variable.
    - id: p5
      tag: two-counters
      code: |-
        def make_counter():
            n = 0
            def counter():
                nonlocal n
                n += 1
                return n
            return counter

        a = make_counter()
        b = make_counter()
        print(a(), a(), b())
      answer: 1 2 1
      why:
        en: Each call to <code>make_counter</code> builds its own <code>n</code>, so the two counters are independent.
    - id: p6
      tag: comprehension-scope
      code: |-
        squares = [j * j for j in range(3)]
        print(squares)
        try:
            print(j)
        except NameError:
            print("j is gone")
      answer: |-
        [0, 1, 4]
        j is gone
      why:
        en: A comprehension has its own scope. Its loop variable does not leak out, unlike a <code>for</code> loop.
    - id: p7
