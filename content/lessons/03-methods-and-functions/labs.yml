    - id: e2
      prompt:
        en: Write <code>make_accumulator()</code> that returns a function. Each call of that function takes a number, adds it to a running total kept in the closure, and returns the total.
      starter: |-
        def make_accumulator():
            pass
      solution: |-
        def make_accumulator():
            """Return a function that keeps a running total."""
            total = 0
            def add(n):
                nonlocal total
                total += n
                return total
            return add
      tests:
