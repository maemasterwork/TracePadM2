    - id: p3
      tag: map-filter
      code: |-
        nums = [1, 2, 3, 4, 5, 6]
        evens = list(filter(lambda n: n % 2 == 0, nums))
        print(list(map(lambda n: n * n, evens)))
      answer: '[4, 16, 36]'
      why:
        en: <code>filter</code> keeps 2, 4, 6. <code>map</code> then squares each. Both return lazy objects, so <code>list()</code> is needed to see the values.
    - id: p4
      tag: reduce
      code: |-
        from functools import reduce
        print(reduce(lambda a, b: a * b, [1, 2, 3, 4]))
        print(reduce(lambda a, b: a + b, [], 0))
      answer: |-
        24
        0
      why:
        en: '<code>reduce</code> folds the items into one value: 1*2*3*4. With an empty list it returns the starting value you gave it.'
    - id: p5
      tag: late-binding
      code: |-
        funcs = [lambda: i for i in range(3)]
        print([f() for f in funcs])
      answer: '[2, 2, 2]'
      why:
        en: All three lambdas look up <code>i</code> when they are <em>called</em>, after the loop finished, so they all see the last value, 2. This is late binding.
    - id: p6
      tag: late-binding-fix
      code: |-
        funcs = [lambda i=i: i for i in range(3)]
        print([f() for f in funcs])
      answer: '[0, 1, 2]'
      why:
        en: The default value <code>i=i</code> is evaluated when each lambda is created, so each one keeps its own number.
