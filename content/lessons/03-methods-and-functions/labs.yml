    quizzes:
    - id: q1
      tag: method-vs-function
      question:
        en: Which one is a <em>method</em> call?
      options:
      - en: <code>len(name)</code>
      - en: <code>name.upper()</code>
      - en: <code>sorted(name)</code>
      - en: <code>print(name)</code>
      correct: 1
      why:
        en: A method belongs to an object and is called with a dot after it. <code>len</code>, <code>sorted</code> and <code>print</code> are stand-alone functions.
    - id: q2
      tag: dir-help
      question:
        en: Which built-in lists the names an object has?
      options:
      - en: <code>dir()</code>
      - en: <code>help()</code>
      - en: <code>type()</code>
      - en: <code>id()</code>
      correct: 0
      why:
        en: <code>dir(obj)</code> lists the names, <code>help(obj.method)</code> shows the documentation, and <code>type(obj)</code> tells you the type.
    - id: q3
      tag: chaining-none
      question:
        en: Why does <code>items.append(1).append(2)</code> fail?
      options:
      - en: <code>append</code> only accepts one number
      - en: <code>append</code> returns <code>None</code>, which has no <code>append</code> method
      - en: Lists are immutable
      - en: You cannot call two methods on one line
      correct: 1
      why:
        en: A method that changes an object in place usually returns <code>None</code>. The second call is then made on <code>None</code> and raises an <code>AttributeError</code>.
    - id: q4
      tag: in-place
      question:
        en: Which of these changes the list it is called on?
      options:
      - en: <code>sorted(nums)</code>
      - en: <code>nums.sort()</code>
      - en: <code>nums.copy()</code>
      - en: <code>len(nums)</code>
      correct: 1
      why:
        en: <code>nums.sort()</code> sorts in place. <code>sorted(nums)</code> and <code>nums.copy()</code> give back new lists, and <code>len</code> just reads.
