    exercises:
    - id: e1
      prompt:
        en: Write <code>is_leap(year)</code> that returns <code>True</code> for a leap year. A year is a leap year if it is divisible by 4, except century years, which must be divisible by 400.
      starter: |-
        def is_leap(year):
            pass
      solution: |-
        def is_leap(year):
            """Return True if year is a leap year."""
            return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
      tests:
      - post: print([is_leap(y) for y in (1900, 2000, 2024, 2026)])
        out: '[False, True, True, False]'
      - post: print(is_leap(1600), is_leap(2100), is_leap(2400), is_leap(7))
        out: True False True False
      hints:
      - en: 'Three rules: divisible by 4, but not by 100, unless also divisible by 400.'
      - en: A condition can combine these with <code>and</code> / <code>or</code>. Use <code>%</code> to test divisibility.
      - en: <code>year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)</code>, returned directly.
    - id: e2
      prompt:
        en: Write <code>average(numbers)</code> that returns the average, or <code>None</code> for an empty list instead of crashing.
      starter: |-
        def average(numbers):
            return sum(numbers) / len(numbers)
      solution: |-
        def average(numbers):
            """Return the mean of numbers, or None if the list is empty."""
            if not numbers:
                return None
            return sum(numbers) / len(numbers)
      tests:
      - post: |-
          print(average([2, 4, 9]))
          print(average([]))
        out: |-
          5.0
          None
      - post: |-
          print(average([10]))
          print(average([1, 2]))
        out: |-
          10.0
          1.5
      hints:
      - en: The starter crashes with a <code>ZeroDivisionError</code> on an empty list. Check for that case first.
      - en: An empty list is falsy, so <code>if not numbers:</code> works. Return <code>None</code> there.
    - id: e3
      prompt:
        en: Fix the mutable-default trap. <code>log</code> should start a new list on every call that does not pass one.
      starter: |-
        def log(message, history=[]):
            history.append(message)
            return history
      solution: |-
        def log(message, history=None):
            """Add message to history (a new list if none is given)."""
            if history is None:
                history = []
            history.append(message)
            return history
      tests:
      - post: |-
          print(log('a'))
          print(log('b'))
        out: |-
          ['a']
          ['b']
      - post: |-
          h = ['x']
          print(log('y', h))
          print(log('z'))
        out: |-
          ['x', 'y']
          ['z']
      hints:
      - en: The default list is built once and shared. Use an immutable default instead.
      - en: 'Use <code>history=None</code>, then inside write <code>if history is None: history = []</code>.'
    - id: e4
      prompt:
        en: Rewrite <code>factorial</code> with a loop instead of recursion. It must return 1 for 0.
      starter: |-
        def factorial(n):
            if n <= 1:
                return 1
            return n * factorial(n - 1)

        # Replace the body with a loop (no calls to factorial inside).
      solution: |-
        def factorial(n):
            """Return n! using a loop."""
            result = 1
            for k in range(2, n + 1):
                result *= k
            return result
      tests:
      - post: print(factorial(0), factorial(1), factorial(5), factorial(10))
        out: 1 1 120 3628800
      - post: print('factorial' in factorial.__code__.co_names)
        out: 'False'
      hints:
      - en: Start with <code>result = 1</code> and multiply it by each number from 2 to <code>n</code>.
      - en: '<code>for k in range(2, n + 1): result *= k</code>, then <code>return result</code>.'
